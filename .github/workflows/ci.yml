name: ci
on: [pull_request, push]
jobs:
  schema-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locked migrations are unchanged and every migration is in db/migrations.lock
        run: ./db/check-migration-lock.sh
  etl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e './etl[test]' && pytest etl/tests -v
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: cd api && ./gradlew test --no-daemon
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd web && npm ci && API_URL=http://api:8080 npm test && npm run build
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          for s in etl api web; do
            docker build -t "bddrug-$s:ci" "$s"
          done
