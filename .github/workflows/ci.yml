name: ci
on: [pull_request, push]
# Read-only token for every job: npm install scripts, Docker builds and lhci run with it.
permissions: {contents: read}
jobs:
  schema-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locked migrations are unchanged and every migration is in db/migrations.lock
        run: ./db/check-migration-lock.sh
  deploy-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: load-dgda stages validator
        run: bash deploy/check-stages.test.sh
  etl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e './etl[test]' && pytest etl/tests -v
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: cd api && ./gradlew test --no-daemon
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd web && npm ci && API_URL=http://api:8080 npm test && npm run build
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          for s in etl api web; do
            docker build -t "bddrug-$s:ci" "$s"
          done
  e2e:
    runs-on: ubuntu-24.04
    env:
      DB_USER: bddrug
      DB_PASSWORD: ci
      GHCR_OWNER: ci
      IMAGE_TAG: ci
      COMPOSE: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: $COMPOSE up -d --build db flyway api web
      - run: $COMPOSE run --rm seed
      - run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3000/healthz
      - run: cd web && E2E_BASE_URL=http://localhost:3000 npx playwright test
      - run: cd web && npx lhci autorun
      - run: cd web && npx lhci autorun --config=./lighthouserc.review.json
      - run: cd web && npx lhci autorun --config=./lighthouserc.learn.json
      - if: failure()
        run: $COMPOSE logs --no-color web api | tail -n 300
