name: deploy
on:
  workflow_run: {workflows: [ci], types: [completed], branches: [main]}
permissions: {contents: read, packages: write}
concurrency: {group: deploy, cancel-in-progress: false}
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          owner="${OWNER,,}"
          for s in etl api web; do
            docker build -t "ghcr.io/${owner}/bddrug-$s:${TAG}" "$s"
            docker push "ghcr.io/${owner}/bddrug-$s:${TAG}"
          done
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: TAG
          script: |
            set -e
            cd /opt/bddrug/deploy
            git -C /opt/bddrug fetch --quiet origin && git -C /opt/bddrug checkout --quiet --detach "$TAG"
            grep -q '^IMAGE_TAG=' .env || { echo "deploy/.env has no IMAGE_TAG line" >&2; exit 1; }
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${TAG}/" .env
            docker compose pull && docker compose up -d --remove-orphans
      - env:
          PREVIEW_DOMAIN: ${{ secrets.PREVIEW_DOMAIN }}
        run: curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "https://$PREVIEW_DOMAIN/batches" -o /dev/null
