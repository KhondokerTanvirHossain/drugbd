name: deploy
on:
  workflow_run: {workflows: [ci], types: [completed], branches: [main]}
permissions: {contents: read, packages: write}
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          owner="${OWNER,,}"
          for s in etl api web; do
            docker build -t "ghcr.io/${owner}/bddrug-$s:${TAG}" "$s"
            docker push "ghcr.io/${owner}/bddrug-$s:${TAG}"
          done
      - uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: TAG
          script: |
            set -e
            cd /opt/bddrug/deploy
            git -C /opt/bddrug pull --ff-only
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${TAG}/" .env
            docker compose pull && docker compose up -d --remove-orphans
      - env:
          PREVIEW_DOMAIN: ${{ secrets.PREVIEW_DOMAIN }}
        run: curl -fsS "https://${PREVIEW_DOMAIN}/" -o /dev/null
