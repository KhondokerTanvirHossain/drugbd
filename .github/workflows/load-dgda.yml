name: load-dgda
on:
  workflow_dispatch:
    inputs: {batch: {description: "Batch file name in batches/, e.g. 0001-pilot.txt", required: true}}
concurrency: {group: deploy, cancel-in-progress: false}
jobs:
  load:
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          BATCH: ${{ inputs.batch }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: BATCH
          command_timeout: 60m
          script: |
            set -e
            case "$BATCH" in *[!A-Za-z0-9._-]*|"") echo "bad batch name"; exit 1;; esac
            test -f "/opt/bddrug/batches/$BATCH" || { echo "batch $BATCH is not in the deployed commit; merge it and let deploy run first" >&2; exit 1; }
            cd /opt/bddrug/deploy
            docker compose --profile jobs run --rm etl --batch "/app/batches/$BATCH"
