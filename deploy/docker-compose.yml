name: bddrug
# Runs on the shared EC2 host behind the existing Caddy (~/n8n). Caddy owns ports 80/443 and proxies
# drugdb.eliooo.org to the alias `bddrug-web` on the shared edge network (see deploy/caddy/drugdb.caddy).
# This file publishes no host ports. The API and DB are reachable only on the internal network.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bddrug
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d bddrug"], interval: 5s, retries: 20}
    mem_limit: 256m
    networks: [internal]
    restart: unless-stopped
  flyway:
    image: flyway/flyway:10
    command: -url=jdbc:postgresql://db:5432/bddrug migrate
    environment:
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
    volumes: [../db/migrations:/flyway/sql:ro]
    depends_on: {db: {condition: service_healthy}}
    mem_limit: 256m
    networks: [internal]
  api:
    image: ghcr.io/${GHCR_OWNER}/bddrug-api:${IMAGE_TAG}
    environment:
      DB_R2DBC_URL: r2dbc:postgresql://db:5432/bddrug
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Required (>= 32 chars): the API refuses to start without it. Only the web server sends it.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on: {flyway: {condition: service_completed_successfully}}
    mem_limit: 448m
    networks: [internal]
    restart: unless-stopped
  web:
    image: ghcr.io/${GHCR_OWNER}/bddrug-web:${IMAGE_TAG}
    environment:
      API_URL: http://api:8080
      # Required (>= 32 chars each): the web server refuses to start without SESSION_SECRET.
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # Reviewer sign-in (README "Reviewer sign-in setup"). Empty values leave sign-in disabled.
      # The NEXT_PUBLIC_* values are also baked into the image at build time from the GitHub repo
      # variables; keep both copies identical.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # email:role pairs, comma-separated; role is pharmacist or engineer. Personal data: host .env only.
      REVIEWERS: ${REVIEWERS:-}
      # Public host (§9.2): Turnstile hostname check, sign-out Origin check, return paths. Required in production.
      SITE_HOST: ${SITE_HOST}
      # Landing page hero product (§6.1).
      HERO_CONCEPT_ID: ${HERO_CONCEPT_ID:-}
    depends_on: [api]
    mem_limit: 256m
    # Every 429 the middleware ends writes a log line, so anyone over the limit sets the log growth rate.
    # Cap it here: the shared host's daemon keeps json-file logs without limit.
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    networks:
      internal: {}
      edge: {aliases: [bddrug-web]}
    restart: unless-stopped
  etl:
    image: ghcr.io/${GHCR_OWNER}/bddrug-etl:${IMAGE_TAG}
    environment: {PGHOST: db, PGPORT: "5432", PGDATABASE: bddrug, PGUSER: "${DB_USER}", PGPASSWORD: "${DB_PASSWORD}"}
    volumes: [../batches:/app/batches:ro]
    profiles: [jobs]
    mem_limit: 256m
    networks: [internal, egress]
volumes: {dbdata: {}}
networks:
  internal: {internal: true}
  # Outbound internet for the ETL only (OCL API); nothing else joins it.
  egress: {}
  # The shared proxy network owned by the Caddy stack in ~/n8n.
  edge: {external: true, name: "${EDGE_NETWORK:-n8n_edge}"}
